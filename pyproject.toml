[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "sklvq"
version = "0.3.0"
description = "A collection of Learning Vector Quantization algorithms compatible with scikit-learn"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"

maintainers = [{ name = "Rick van Veen", email = "r.van.veen133@gmail.com" }]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
dependencies = ["numpy>=1.17.3", "scikit-learn==1.5.2", "scipy>=1.3.2"]

[project.optional-dependencies]
docs = [
    "matplotlib",
    "numpydoc",
    "pillow",
    "sphinx",
    "sphinx-gallery",
    "sphinx_rtd_theme",
]
tests = ["coverage", "pandas", "pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/rickvanveen/sklvq"
Documentation = "https://sklvq.readthedocs.io/en/latest/"
Issues = "https://github.com/rickvanveen/sklvq/issues"
Source = "https://github.com/rickvanveen/sklvq"

[dependency-groups]
dev = ["ruff"]

[tool.coverage.run]
source_pkgs = ["sklvq"]
branch = true
parallel = true
omit = ["src/sklvq/__about__.py"]

[tool.coverage.paths]
sklvq = ["src/sklvq", "*/sklvq/src/sklvq"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
