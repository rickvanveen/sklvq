name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"
          python-version: "3.12"
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff format --check src/sklvq/ examples/ tests/
      - run: uv run --no-sync ruff check src/sklvq/ examples/ tests/
  test:
    name: Test (Python ${{ matrix.python-version }}, sklearn ${{ matrix.sklearn }})
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        sklearn: ["1.7.2", "1.8.0", "1.9.1"]
        include:
          - python-version: "3.12"
            sklearn: "1.9.1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-dev --extra tests
      - run: uv pip install "scikit-learn==${{ matrix.sklearn }}"
      - run: uv run --no-sync pytest --cov=src/sklvq --cov-report=xml --junitxml=junit.xml tests/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          disable_search: true
          files: coverage.xml
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          disable_search: true
          files: junit.xml
